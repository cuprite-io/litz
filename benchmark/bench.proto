syntax = "proto3";

package benchmark;

option go_package = "github.com/cuprite-io/litz/benchmark";

message SmallPayload {
    uint64 id = 1;
}

message MediumPayload {
    uint64 id = 2;
    string email = 3;
    bool active = 4;
    uint32 clicks = 5;
}

message LargePayload {
    uint64 id = 1;
    string name = 2;
    bool active = 3;
    repeated int64 numbers = 4;
    repeated string tags = 5;
    MediumPayload child = 6;
}
